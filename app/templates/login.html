<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmony — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f43f5e'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="min-h-screen bg-[#fdfaf5] flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-sm">
      <div class="flex flex-col items-center mb-10">
        <div class="bg-gradient-to-br from-rose-400 to-orange-300 p-4 rounded-3xl shadow-rose-200/50 shadow-xl text-white mb-4">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
        <h1 class="text-3xl font-black text-slate-800 tracking-tight">Harmony</h1>
        <p class="text-sm font-medium text-rose-400/80 italic mt-1">Mediação Inteligente para Casais</p>
      </div>

      <form method="POST" action="/login"
            class="bg-white rounded-3xl shadow-xl shadow-rose-900/5 border border-rose-100/30 p-8 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-500 tracking-widest uppercase mb-2">Usuário</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" name="username" placeholder="seu usuário" autocomplete="username" required
                   class="w-full bg-slate-50 border border-rose-100/50 rounded-2xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-4 focus:ring-rose-500/10 focus:border-rose-300 transition-all text-slate-800 font-medium placeholder:text-slate-300" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 tracking-widest uppercase mb-2">Senha</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required
                   class="w-full bg-slate-50 border border-rose-100/50 rounded-2xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-4 focus:ring-rose-500/10 focus:border-rose-300 transition-all text-slate-800 font-medium placeholder:text-slate-300" />
          </div>
        </div>

        {{if .Error}}
        <p class="text-xs text-rose-500 font-semibold text-center">Credenciais inválidas. Tente novamente.</p>
        {{end}}

        <button type="submit"
                class="w-full bg-gradient-to-r from-rose-500 to-orange-400 hover:from-rose-600 hover:to-orange-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-200 transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          Entrar
        </button>
      </form>

      <p class="text-center text-[10px] text-slate-300 font-medium mt-6">
        Plataforma segura de mediação para casais
      </p>
    </div>
  </div>
</body>
</html>
