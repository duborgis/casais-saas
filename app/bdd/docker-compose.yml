# BDD stack: nginx (reverse proxy, como em prod) → app → WireMock no papel
# da AWS (SSM GetParameter + AgentCore InvokeAgentRuntime via AWS_ENDPOINT_URL).
name: harmonia-bdd

services:
  wiremock:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      # admin API exposta para a suíte inspecionar o journal de requests
      - "${BDD_WIREMOCK_PORT:-8090}:8080"

  app:
    build:
      context: ..
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: bdd-test
      AWS_SECRET_ACCESS_KEY: bdd-test
      AWS_ENDPOINT_URL: http://wiremock:8080
      AWS_EC2_METADATA_DISABLED: "true"
      ORCHESTRATOR_ARN: arn:aws:bedrock-agentcore:us-east-1:000000000000:runtime/bdd-orchestrator
      DB_PATH: /tmp/harmonia-bdd.db
    depends_on:
      - wiremock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BDD_PORT:-8089}:80"
    depends_on:
      app:
        condition: service_healthy
