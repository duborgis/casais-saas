<div id="modal" hx-swap-oob="true">
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-8">
      <div class="flex flex-col items-center text-center">
        <span class="text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase mb-4">Anúncio</span>

        <!-- mock rewarded video -->
        <div class="w-full h-44 rounded-3xl bg-gradient-to-br from-indigo-500 via-purple-500 to-rose-400 flex flex-col items-center justify-center text-white mb-4 relative overflow-hidden">
          <svg class="w-12 h-12 mb-2 animate-pulse" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <p class="font-bold text-sm m-0">Seu anúncio apareceria aqui</p>
          <p class="text-[10px] opacity-70 m-0 mt-1">(simulação para teste de usabilidade)</p>
          <div class="absolute bottom-0 left-0 h-1 bg-white/80 transition-all duration-1000 ease-linear" id="ad-progress" style="width: 0%"></div>
        </div>

        <p class="text-xs text-slate-400 font-medium mb-5" id="ad-countdown">Aguarde 5s…</p>

        <button id="ad-claim" hx-post="/ads/complete" hx-swap="none" disabled
                class="w-full bg-rose-500 hover:bg-rose-600 disabled:bg-slate-200 disabled:cursor-not-allowed text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-200 disabled:shadow-none transition-all">
          Resgatar +{{.Bonus}} mensagens
        </button>
      </div>
    </div>
  </div>
  <script>runAdCountdown(5)</script>
</div>
