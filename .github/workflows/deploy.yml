name: Build & Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ops-*.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app (linux/arm64 for t4g)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Pull new image and restart app on EC2
        run: |
          INSTANCE_ID=$(aws ssm get-parameter \
            --name /casais-saas/ec2/instance-id \
            --query 'Parameter.Value' --output text)

          # Wait for the SSM agent to register (fresh instances take a few minutes)
          for i in $(seq 1 20); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo None)
            [ "$PING" = "Online" ] && break
            echo "SSM agent not online yet ($PING), retry $i/20"
            sleep 15
          done

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy harmonia ${{ github.sha }}" \
            --parameters 'commands=["cd /opt/casais && docker compose pull app && docker compose up -d app && docker image prune -f"]' \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          echo "Deploy status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          [ "$STATUS" = "Success" ]
