name: Test Harmonia Orchestrator

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Mensagem para o agente"
        required: false
        default: "Oi! Estamos tendo dificuldades para nos comunicar de forma saudável. Às vezes uma conversa vira briga. Como podemos melhorar isso?"

permissions:
  contents: read

jobs:
  test:
    name: Test Orchestrator Invoke
    runs-on: ubuntu-latest
    environment: prod

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3 --quiet

      - name: Invoke Harmonia Orchestrator
        run: |
          python3 - <<'PYEOF'
          import boto3, json, sys

          region = "us-east-1"
          ssm = boto3.client("ssm", region_name=region)
          orch_arn = ssm.get_parameter(Name="/casais-saas/agents/orchestrator-arn")["Parameter"]["Value"]
          print(f"Orchestrator ARN: {orch_arn}")

          msg = "${{ inputs.message || 'Oi, estamos tendo dificuldades para nos comunicar. Como podemos melhorar?' }}"
          payload = {
              "sessionId": "test-session-001",
              "input": {
                  "text": msg,
                  "userId": "test-user",
                  "agentId": "orchestrator",
              }
          }
          print(f"Message: {msg}")
          print("---")

          client = boto3.client("bedrock-agentcore", region_name=region)
          response = client.invoke_agent_runtime(
              agentRuntimeArn=orch_arn,
              qualifier="DEFAULT",
              contentType="application/json",
              accept="application/json",
              payload=json.dumps(payload).encode("utf-8"),
          )

          body = response["response"].read().decode("utf-8")
          print("Raw response body:")
          print(body[:2000])

          try:
              parsed = json.loads(body)
              text = parsed.get("output", {}).get("text", "") or str(parsed)
              print("\nAgent response:")
              print(text)
          except Exception as e:
              print(f"Parse error: {e}")
          PYEOF
