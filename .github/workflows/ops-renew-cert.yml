name: Ops - Force cert issuance

on:
  workflow_dispatch:

jobs:
  renew:
    name: Restart acme-companion on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Restart acme-companion
        run: |
          INSTANCE_ID=$(aws ssm get-parameter \
            --name /casais-saas/ec2/instance-id \
            --query 'Parameter.Value' --output text)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Force ACME cert issuance" \
            --parameters 'commands=["docker restart nginx-proxy-acme && sleep 90 && docker logs --tail 40 nginx-proxy-acme"]' \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
