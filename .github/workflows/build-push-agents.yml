name: Build and Push Casais Agents

on:
  push:
    tags:
      - "agents-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Agents Image ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: prod

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: casais-agents

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: agents/
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Trigger AgentCore Terraform Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: prod

    steps:
      - name: Trigger terraform-casais-agents-apply in aws-terraform
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TERRAFORM_TRIGGER_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'aws-terraform',
              workflow_id: 'terraform-casais-agents-apply.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ needs.build.outputs.image_tag }}'
              }
            });
            console.log('Triggered terraform-casais-agents-apply.yml with tag ${{ needs.build.outputs.image_tag }}');
